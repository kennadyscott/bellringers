<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellringers has moved — Teacher Plate</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://teacherplate.com/bellringers/">
<script>
  /* Path-preserving redirect. JS, not meta-refresh: a meta-refresh drops the
     #/library fragment, which is how every deep link into this app is written.
     The path structure is identical on the new domain, so pathname maps 1:1. */
  (function () {
    var p = location.pathname;
    if (p === "" || p === "/") p = "/bellringers/";
    location.replace("https://teacherplate.com" + p + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="3; url=https://teacherplate.com/bellringers/">
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;font-family:Inter,-apple-system,BlinkMacSystemFont,
       "Segoe UI",sans-serif;color:#14213D;background:#fff;text-align:center;padding:24px}
  h1{font-size:22px;margin:0 0 10px;font-weight:700}
  p{margin:0;color:#3C4C6B;line-height:1.6}
  a{color:#3567E8;font-weight:600}
</style>
</head>
<body>
  <div>
    <h1>Bellringers has moved</h1>
    <p>It now lives at <a href="https://teacherplate.com/bellringers/">teacherplate.com/bellringers</a><br>
       Taking you there now.</p>
  </div>
</body>
</html>
